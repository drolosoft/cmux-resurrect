# crex Feature Inventory
# Machine-readable matrix of features x backends x platforms.
# Status: supported, unsupported, inferred, planned, experimental

version: 1
updated: "2026-07-10"

backends:
  cmux:
    platforms: [macos, linux]
    status: stable
  ghostty:
    platforms: [macos]
    status: stable
    notes: "AppleScript API; libghostty planned for Linux"

features:
  - name: save
    description: Capture current terminal state to TOML
    cmux: supported
    ghostty: supported

  - name: restore
    description: Recreate workspaces from saved layout
    cmux: supported
    ghostty: supported

  - name: watch-daemon
    description: Auto-save on interval with change detection
    cmux: supported
    ghostty: supported

  - name: templates
    description: Embedded workspace templates (16 built-in)
    cmux: supported
    ghostty: supported

  - name: browser-panes
    description: Save/restore browser panes
    cmux: supported
    ghostty: unsupported
    notes: "Ghostty opens URL in default browser instead"

  - name: split-direction
    description: Preserve pane split direction and arrangement
    cmux: supported
    ghostty: inferred
    notes: "cmux: exact arrangement via pixel-frame BSP inference (v1.22.x). Ghostty: AppleScript exposes no frames; saves default to a right-chain until libghostty"

  - name: per-pane-cwd
    description: Individual pane working directories
    cmux: supported
    ghostty: supported
    notes: "cmux: debug.terminals (v1.21.1+). Ghostty: OSC 7 working directory, with a title-derived fallback validated on disk (v1.23.0); restore sends per-pane cd on both"

  - name: ai-session-detection
    description: Detect and restore AI CLI sessions
    cmux: supported
    ghostty: supported
    notes: "Full resume: Claude, OpenCode, Codex, Amp, Gemini, Copilot, Grok. Process-aware: Cursor, Aider, Pi, Rovo, Hermes, CodeBuddy, Factory, Qoder"

  - name: workspace-blueprint
    description: Markdown workspace definitions
    cmux: supported
    ghostty: supported

  - name: tui
    description: Interactive terminal UI (Bubble Tea)
    cmux: supported
    ghostty: supported

  - name: shell-hook
    description: Auto-start watch from shell prompt
    cmux: supported
    ghostty: supported

  - name: revision-tracking
    description: Monotonic revision counter on layout saves
    cmux: supported
    ghostty: supported

  - name: stability-wait
    description: Evidence-based shell readiness detection
    cmux: supported
    ghostty: supported

  - name: ensure-workspace
    description: Single-call create-or-reuse workspace API
    cmux: supported
    ghostty: supported

  - name: dry-run
    description: Preview restore commands without executing
    cmux: supported
    ghostty: supported

  - name: workspace-filter
    description: Restore single workspace by name/substring
    cmux: supported
    ghostty: supported

  - name: smart-restore
    description: Auto-detect restore mode from terminal state
    cmux: supported
    ghostty: supported

  - name: import-export
    description: Import/export layouts as markdown
    cmux: supported
    ghostty: supported

  - name: self-update
    description: Update crex from CLI or TUI (Homebrew, go install)
    cmux: supported
    ghostty: supported
    notes: "Detects install method, checks GitHub API for latest release"

  - name: launchd
    description: macOS launchd service for watch daemon
    cmux: supported
    ghostty: unsupported
    notes: "Uses cmux socket path detection"
